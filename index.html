<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniela Valdez — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,400&family=DM+Sans:wght@400;500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2ea;
  --dot:rgba(120,90,60,.18);
  --ink:#24201c;
  --muted:#7a7068;
  --clay:#c8643f;
  --clay-soft:#f0c9b5;
  --sage:#8fa98a;
  --sage-soft:#d6e3cf;
  --butter:#fbe7a3;
  --chrome:rgba(255,252,247,.78);
  --serif:'Fraunces',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --hand:'Gochi Hand',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--clay)}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto;height:32px;z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:13px;background:var(--chrome);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(60,40,20,.08)}
.topbar .side{display:flex;align-items:center;gap:6px;white-space:nowrap}
.logo{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--clay) 0 50%,var(--sage) 0 100%);margin-right:8px}
.tb-link{padding:3px 8px;border-radius:5px}
.tb-link:hover{background:rgba(60,40,20,.07)}
.tb-link.name{font-weight:700}
.tb-meta{color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- desktop ---------- */
.desk{position:fixed;inset:32px 0 0;overflow:hidden;
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);
  background-size:20px 20px}
.desk::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(200,100,63,.07))}

.hero{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;user-select:none;z-index:1}
.hero .hi{font-family:var(--hand);font-size:clamp(22px,2.4vw,30px);color:var(--clay);transform:rotate(-3deg);display:inline-block;margin-bottom:-4px}
.hero h1{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(58px,10vw,140px);line-height:.95;letter-spacing:-.02em;white-space:nowrap}
.hero h1 .l{display:inline-block;transition:transform .2s cubic-bezier(.3,1.6,.5,1),color .2s}
.hero h1 .l:hover{transform:translateY(-12px) rotate(-6deg);color:var(--clay)}
.hero .role{margin-top:14px;font-size:clamp(14px,1.3vw,16px);color:var(--muted);letter-spacing:.02em}
.hero .role b{color:var(--ink);font-weight:600}

/* polaroid */
.polaroid{position:absolute;width:150px;z-index:5;background:#fff;padding:9px 9px 30px;box-shadow:0 10px 22px rgba(60,40,20,.16);transform:rotate(-4deg);cursor:grab;touch-action:none;user-select:none}
.polaroid .pic{aspect-ratio:1;width:100%;display:block;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.polaroid.p1{left:4%;top:6%}
.polaroid.p2{left:15%;top:4%;transform:rotate(5deg)}
.polaroid.dragging{z-index:60;cursor:grabbing}
.polaroid span{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--hand);font-size:16px;color:var(--muted)}

/* icons */
.icon{position:absolute;width:118px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 4px;border-radius:8px;touch-action:none;user-select:none;transform:translateX(-50%)}
.icon:hover .lbl,.icon:focus-visible .lbl,.icon.sel .lbl{background:var(--clay);color:#fff}
.icon:focus-visible{outline:none}
.icon.dragging{opacity:.85;z-index:60;cursor:grabbing}
.ico{width:60px;height:50px;filter:drop-shadow(0 3px 3px rgba(60,40,20,.14))}
.ico.doc{width:42px;height:52px}
.ico.finder.warm{filter:drop-shadow(0 3px 4px rgba(150,70,30,.2))}
.ico.finder{width:66px;height:54px;filter:drop-shadow(0 3px 4px rgba(20,60,120,.18))}
.icon.proj:hover .lbl,.icon.proj:focus-visible .lbl{background:#2f80ed}
.icon.proj.warm:hover .lbl,.icon.proj.warm:focus-visible .lbl{background:var(--clay)}
.lbl{font-size:11.5px;font-weight:500;text-align:center;line-height:1.25;padding:1px 6px;border-radius:5px}

/* ---------- windows ---------- */
#wins{position:absolute;inset:0;pointer-events:none;z-index:20}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;max-height:calc(100% - 118px);background:#fffdf9;border-radius:14px;overflow:hidden;box-shadow:0 28px 64px rgba(60,30,10,.24),0 0 0 1px rgba(60,40,20,.08);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}}
.win.closing{animation:shut .14s ease-in forwards}
@keyframes shut{to{transform:scale(.95);opacity:0}}
.bar{flex:0 0 38px;position:relative;display:flex;align-items:center;justify-content:center;background:#f3ece2;border-bottom:1px solid #e8dfd2;cursor:grab;touch-action:none;user-select:none}
.dots{position:absolute;left:13px;display:flex;gap:8px}
.dots>*{width:12px;height:12px;border-radius:50%;display:block}
.dots .x{background:#ff5f57}.dots .m{background:#febc2e}.dots .z{background:#28c840}
.dots:hover .x::after{content:"×";display:block;font-size:11px;line-height:12px;text-align:center;color:#6b0000}
.dots:hover .z::after{content:"+";display:block;font-size:11px;line-height:12px;text-align:center;color:#0a5016}
.wt{font-size:13px;font-weight:600;color:#6b6158}
.win.max{left:10px!important;top:10px!important;right:10px;bottom:98px;width:auto!important;max-height:none}
.body{overflow:auto;padding:24px 26px 28px;font-size:14.5px;line-height:1.65}
.body h2{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.08;letter-spacing:-.01em;margin-bottom:8px}
.body h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:22px 0 6px;font-weight:600}
.body p+p{margin-top:10px}
.kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--clay);font-weight:700;margin-bottom:8px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:9px 18px;border-radius:99px;background:var(--ink);color:#fff;text-decoration:none;font-weight:500;font-size:14px}
.btn:hover{background:var(--clay)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;padding:4px 11px;border-radius:99px;background:var(--sage-soft);color:#3e5a3a;font-weight:500}
.chip.l{background:#e9e1f0;color:#5b4170}
.chip.c{background:var(--clay-soft);color:#7d3418}

/* about */
.about-top{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center;margin-bottom:6px}
.avatar{width:120px;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 6px 16px rgba(60,40,20,.15);background:linear-gradient(150deg,var(--clay-soft),var(--sage-soft));display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:44px;color:var(--clay)}

/* projects */
.cover{aspect-ratio:21/9;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:44px;color:#fff;letter-spacing:-.01em}
.case{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:34px;padding:26px 32px 4px}
.case p{max-width:62ch}
.facts{align-self:start;margin-top:6px;padding:16px 18px;background:#f6efe6;border-radius:12px;display:grid;gap:12px}
.facts dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.facts dd{font-size:14px;margin-top:1px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:8px 32px 0}
.gallery div{aspect-ratio:4/3;border-radius:10px;display:grid;place-items:center;font-size:12px;color:rgba(0,0,0,.4);text-align:center;padding:8px}
.win.big .body{padding:0 0 30px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stats div{padding:12px 14px;border-radius:12px;background:#f8f2ea}
.stats b{display:block;font-family:var(--serif);font-size:28px;font-weight:400;line-height:1.1}
.stats small{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:2px}

.cover.img{aspect-ratio:auto;height:300px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;overflow:hidden;
  background:radial-gradient(60% 90% at 78% 60%,rgba(255,255,255,.16),transparent 70%),linear-gradient(135deg,var(--cc),#5c0b0d);font-style:normal}
.cover.img .ct{color:#fff;font-family:var(--sans);display:flex;flex-direction:column;gap:4px;max-width:50%}
.cover.img .ct small{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;opacity:.75;font-weight:700}
.cover.img .ct b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:46px;line-height:1.02}
.cover.img .ct span{font-size:13.5px;opacity:.85}
.cover.img img{height:150%;align-self:flex-start;margin:3% 4% 0 0;filter:drop-shadow(0 18px 24px rgba(0,0,0,.25))}
.ticks{list-style:none;display:grid;gap:6px}
.ticks li{position:relative;padding-left:22px}
.ticks li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--clay-soft);box-shadow:0 0 0 2px var(--clay) inset}
.shots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;padding:0 32px}
.shots figure{grid-column:span 6}.shots .s4{grid-column:span 4}.shots .s3{grid-column:span 3}.shots .s2{grid-column:span 2}
.shots .tall img{aspect-ratio:3/4;object-fit:cover}
.shots .s4 img,.shots .s2:not(.tall) img{height:260px;object-fit:cover}
.shots .sq img{aspect-ratio:1;height:auto!important;object-fit:cover}
.shots .sq.fit img{object-fit:contain}
.shots .doc img{aspect-ratio:4/5;height:auto!important;object-fit:cover}
.shots .fit img{object-fit:contain!important;padding:14px;background:#f1ebe2}
.cover.photo{aspect-ratio:auto;height:340px;display:block;overflow:hidden;background:#ddd}
.cover.photo img{width:100%;height:100%;object-fit:cover;display:block}
.shots figure{margin:0}
.shots img{width:100%;display:block;border-radius:12px;background:#efe7dc;cursor:zoom-in}
.shots figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.lightbox{position:fixed;inset:0;z-index:5000;background:rgba(24,18,14,.82);display:grid;place-items:center;padding:24px;cursor:zoom-out;animation:pop .18s ease-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
@media (max-width:720px){.cover.img{height:auto;flex-direction:column;align-items:flex-start;padding:24px 20px 0;gap:10px}.cover.img .ct{max-width:none}.cover.img .ct b{font-size:34px}.cover.img img{height:300px;align-self:center;margin:0 0 -40px}.shots{padding:0 20px;gap:12px}.shots .s4,.shots .s2,.shots .s3{grid-column:span 6}.shots .tall,.shots .doc,.shots .sq{grid-column:span 3}.shots .s4 img,.shots .s2:not(.tall) img{height:auto}.cover.photo{height:220px}}
.brands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:0 32px}
.brand{margin:0;background:#f8f2ea;border-radius:14px;overflow:hidden}
.brand img{width:100%;aspect-ratio:3/2;object-fit:contain;background:#fff;display:block;cursor:zoom-in}
.brand figcaption{padding:12px 14px 14px}
.brand b{display:block;font-size:14.5px}
.brand span{display:block;font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}
@media (max-width:720px){.brands{grid-template-columns:1fr;padding:0 20px}}
.dlrow{display:flex;gap:8px;flex-wrap:wrap}.dlrow .btn{margin-top:4px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.lock{margin:0 32px;padding:30px 28px;border-radius:16px;background:#f6efe6;border:1.5px dashed #dccdbb;text-align:center}
.lk-ico{width:52px;height:52px;margin:0 auto 10px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--clay);box-shadow:0 2px 8px rgba(60,40,20,.1)}
.lk-ico svg{width:24px;height:24px}
.lock h4{font-family:var(--serif);font-weight:400;font-size:24px}
.lock p{max-width:46ch;margin:6px auto 0;color:var(--muted);font-size:14px}
.lock .btn{margin-top:14px}
.lock .lk-mail{font-size:12.5px;margin-top:8px}
.lk-form{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.lk-form input{font:inherit;font-size:14px;padding:9px 14px;border:1px solid #e3d9cc;border-radius:99px;background:#fff;width:200px;text-transform:uppercase}
.lk-form .btn{margin-top:0}
.lk-err{color:#b3261e!important;font-size:13px!important;min-height:1em}
@media (max-width:720px){.lock{margin:0 20px;padding:24px 18px}}
/* project list */
.plist{display:grid;gap:8px;margin-top:8px}
.plist button{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;background:#f8f2ea;transition:background .15s,transform .15s}
.plist button:hover{background:#dcebfb;transform:translateX(3px)}
.plist .sw svg{width:48px;height:40px;display:block}
.plist b{display:block;font-size:14.5px}
.plist small{color:var(--muted);font-size:12.5px}
.plist .arr{color:var(--muted)}

/* resume */
.tl{margin-top:6px;border-left:2px solid var(--clay-soft);padding-left:18px;display:grid;gap:16px}
.tl div{position:relative}
.tl div::before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--clay)}
.tl b{display:block}
.tl small{color:var(--muted)}

/* contact */
.form{display:grid;gap:10px;margin-top:14px}
.form input,.form textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid #e3d9cc;border-radius:10px;background:#fff;color:var(--ink);resize:vertical}
.form input:focus,.form textarea:focus{outline:2px solid var(--clay-soft);border-color:var(--clay)}
.links{display:grid;gap:6px;margin-top:6px}
.links a{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:#f8f2ea;text-decoration:none;color:var(--ink);font-weight:500}
.links a:hover{background:var(--clay-soft)}
.links a span{color:var(--muted);font-weight:400}

/* books */
.book{display:grid;grid-template-columns:10px 1fr;gap:16px;margin-top:14px;padding:16px 18px 16px 0;border-radius:12px;background:#f8f2ea;overflow:hidden}
.book .spine{background:var(--b)}
.book b{font-family:var(--serif);font-size:20px;font-weight:400;font-style:italic}
.book small{display:block;color:var(--muted);font-size:12.5px}
.book .orig{margin-top:10px;font-size:13.5px;color:var(--muted);font-style:italic}
.book .tr{margin-top:6px;font-family:var(--serif);font-size:17px;line-height:1.5}
.book .tr.empty{font-family:var(--sans);font-size:13.5px;color:var(--muted);border:1.5px dashed #d8cbbb;border-radius:8px;padding:10px 12px}
.book .fn{margin-top:8px;font-size:11.5px}

/* language toggle */
.lang{display:inline-flex;padding:2px;border-radius:99px;background:rgba(60,40,20,.08);margin-right:10px}
.lang button{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:99px;color:var(--muted);transition:background .15s,color .15s}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,40,20,.18)}
.lang button:hover:not([aria-pressed="true"]){color:var(--ink)}
.snote{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:420px){.hide-xs{display:none}.lang{margin-right:4px}}
/* apps widget */
.appsw{position:absolute;left:50%;transform:translateX(-50%);bottom:98px;width:auto;z-index:6;padding:14px 16px 12px;border-radius:22px;background:rgba(255,252,247,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(60,30,10,.14),0 0 0 1px rgba(60,40,20,.08);cursor:grab;touch-action:none;user-select:none}
.appsw.dragging{cursor:grabbing;z-index:60}
.appsw h4{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 2px 10px;text-align:center}
.appgrid{display:grid;grid-template-columns:repeat(9,56px);gap:6px 3px}
.appt{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.appt .tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:0 2px 6px rgba(60,40,20,.12),inset 0 0 0 1px rgba(60,40,20,.06);overflow:hidden}
.appt .tile img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.appt .tile.ph{background:repeating-linear-gradient(135deg,#f6efe6 0 6px,#efe6da 6px 12px);box-shadow:inset 0 0 0 1.5px #e0d4c4}
.appt span{font-size:10px;font-weight:500;line-height:1.15;text-align:center;color:var(--ink);max-width:66px}
/* pixel landscape */
#scene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.desk{background:transparent!important}
.desk::after{display:none}
.hero h1,.hero .role{text-shadow:0 0 18px rgba(255,248,238,.95),0 0 36px rgba(255,248,238,.8),0 1px 0 rgba(255,248,238,.9)}
.hero .hi{text-shadow:0 0 12px rgba(255,248,238,.95)}
.hero .role{display:inline-block;padding:4px 14px;border-radius:99px;background:rgba(255,252,247,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none}
.lbl{background:rgba(255,252,247,.86);box-shadow:0 1px 3px rgba(40,30,20,.15)}
/* apps widget toggle */
.appsw[hidden]{display:none!important}
.appsw:not([hidden]){animation:pop .2s ease-out}
.app.launch{background:linear-gradient(180deg,#ffffff,#eef0f4)!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -3px 0 rgba(0,0,0,.05)}
.app.launch svg{width:34px;height:34px}
/* group labels */
.glabel{position:absolute;transform:translateX(-50%);z-index:3;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding:3px 10px;border-radius:99px;background:rgba(255,252,247,.82);color:#2f6fc0;box-shadow:0 1px 4px rgba(40,30,20,.12);pointer-events:none}
.glabel.warm{color:var(--clay)}
/* day / night */
.theme-btn{width:26px;height:22px;border-radius:99px;display:grid;place-items:center;margin-right:6px;color:var(--ink)}
.theme-btn:hover{background:rgba(60,40,20,.08)}
.theme-btn svg{width:15px;height:15px}
body.night .hero h1{color:#fff4e6;text-shadow:0 0 18px rgba(20,18,50,.9),0 0 40px rgba(20,18,50,.7)}
body.night .hero .hi{color:#ffb68a;text-shadow:0 0 12px rgba(20,18,50,.95)}
body.night .glabel{background:rgba(30,28,60,.78);color:#a9c8ff}
body.night .glabel.warm{color:#ffb68a}
body.night .lbl{background:rgba(255,252,247,.9)}
@media (max-width:720px){.glabel{display:none}}
/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:900;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-radius:22px;background:rgba(255,252,247,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 34px rgba(60,30,10,.16),0 0 0 1px rgba(60,40,20,.08)}
.app{position:relative;width:50px;height:50px;border-radius:13px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:22px;transition:transform .18s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.app svg{width:24px;height:24px}
.app:hover{transform:translateY(-8px) scale(1.12)}
.app .tip{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:3px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.app:hover .tip{opacity:1}
.app.on::after{content:"";position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(60,40,20,.15)}

/* ---------- mobile ---------- */
@media (max-width:720px){

function merge(a,b,key){
  if(b===undefined) return a;
  if(key==="facts") return b;
  if(Array.isArray(b)){
    if(Array.isArray(a) && b.some(x=>x&&typeof x==="object"&&!Array.isArray(x))) return a.map((x,i)=>merge(x,b[i]));
    return b;
  }
  if(b&&typeof b==="object"&&a&&typeof a==="object"){
    const o={...a}; for(const k in b) o[k]=merge(a[k],b[k],k); return o;
  }
  return b;
}

/* ---------- drag ---------- */
function makeDraggable(handle, el, onTap){
  handle.addEventListener("pointerdown",e=>{
    if(e.target.closest(".dots")) return;
    if(matchMedia("(max-width:720px)").matches && el.classList.contains("icon")) { return; }
    const desk=document.getElementById("desk").getBoundingClientRect();
    if(el.classList.contains("appsw")&&el.style.transform!=="none"){const r0=el.getBoundingClientRect();el.style.transform="none";el.style.bottom="auto";el.style.left=(r0.left-desk.left)+"px";el.style.top=(r0.top-desk.top)+"px";}
    const r=el.getBoundingClientRect(); const ox=e.clientX-r.left, oy=e.clientY-r.top;
    const isIcon=el.classList.contains("icon"); let moved=false; const sx=e.clientX, sy=e.clientY;
    handle.setPointerCapture(e.pointerId);
    const mv=ev=>{
      if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<4) return;
      moved=true; el.classList.add("dragging");
      if(el.classList.contains("max")) return;
      let x=ev.clientX-desk.left-ox, y=ev.clientY-desk.top-oy;
      y=Math.max(0,Math.min(y,desk.height-40)); x=Math.max(-r.width+80,Math.min(x,desk.width-80));
      el.style.left=(isIcon? x+r.width/2 : x)+"px"; el.style.top=y+"px";
    };
    const up=()=>{handle.removeEventListener("pointermove",mv);handle.removeEventListener("pointerup",up);el.classList.remove("dragging");if(!moved&&onTap)onTap()};
    handle.addEventListener("pointermove",mv);handle.addEventListener("pointerup",up);
  });
  if(onTap) handle.addEventListener("click",e=>{ if(matchMedia("(max-width:720px)").matches) onTap(); });
  handle.addEventListener("keydown",e=>{if(e.key==="Enter"&&onTap){e.preventDefault();onTap()}});
}

    } else {

    // far range

    }
    // pine forest
    const pines=[]; for(let x=-4;x<W+4;x+=7+(R()*12|0)) if(R()<.75) pines.push([x,horizon-3-(R()*5|0),8+(R()*10|0)]);

  function drawCastle(g,cx,gy,R,nz){
    const rect=(x0,y0,x1,y1,litEdge)=>{for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let c=P.wall; if(x<x0+2) c=P.wallHi; else if(x>x1-3) c=P.wallDk; if(((x*7+y*13)%23)===0) c=P.wallDk; px(g,x,y,c)}};

      for(let y=top;y<horizon;y++){let c=x<cx-6?P.rockHi:P.rock; if(((x*5+y*3)%11)===0||y>horizon-4) c=P.rockDk; px(g,x,y,c)}}

    rect(cx-18,gy-18,cx-11,gy); rect(cx+11,gy-18,cx+18,gy);
    roof(cx-19,cx-10,gy-19,9); roof(cx+10,cx+19,gy-19,9);
    rect(cx-7,gy-21,cx+7,gy-8); crenel(cx-7,cx+7,gy-21);
    rect(cx-3,gy-31,cx+3,gy-21); roof(cx-4,cx+4,gy-32,11);

  }

  function makeCloud(R,x,y,scale,speed){
    const w=Math.round(70*scale+24), h=Math.round(34*scale+14);
    const c=makeCanvas(w,h), g=c.getContext("2d");
    const baseY=h-3, puffs=[];
    const cnt=7+(R()*5|0);
    for(let i=0;i<cnt;i++){
      const t=i/(cnt-1), px_=w*(.12+t*.76)+(R()-.5)*w*.08;
      const bump=Math.sin(t*Math.PI); const r=h*(.18+bump*.30+R()*.08);
      puffs.push([px_, baseY-r*.55-bump*h*.18, r]);
    }
    for(let i=0;i<3;i++){const px_=w*(.3+R()*.4), r=h*(.25+R()*.12); puffs.push([px_, baseY-h*.42-R()*h*.12, r])}
    const cream=hex(NIGHT?"#a9acdf":"#fffaf0"), wht=hex(NIGHT?"#8487c2":"#fff3e2"), pink=hex(NIGHT?"#666aa6":"#f9dccb"), lav=hex(NIGHT?"#50548e":"#efc6bf"), lav2=hex(NIGHT?"#40447a":"#dfb3b4");
    for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
      if(yy>baseY) continue;
      let best=-1, lit=0;
      for(const [cx,cy,r] of puffs){const dx=xx-cx, dy=yy-cy, dd=(dx*dx+dy*dy)/(r*r); if(dd<=1){const l=(-dy/r)*.6+(dx/r)*.25+.45; if(l>lit) lit=l; best=1}}
      if(best<0) continue;
      const v=lit*.75+(1-yy/h)*.45 - (yy>baseY-3?.25:0);
      const th=BAYER[yy&3][xx&3]*.08;
      const col= v>.98+th?cream: v>.62+th?wht: v>.44+th?pink: v>.30+th?lav: lav2;
      px(g,xx,yy,col);
    }
    return {img:c,x,y,speed};
  }

  let last=0, frame=0;
  function draw(ts){
    frame++;
    ctx.drawImage(sky,0,0);
    for(const c of clouds){
      if(!reduce) c.x+=c.speed*(ts-last>0&&ts-last<200?(ts-last)/16:1);
      if(c.x>W+10) c.x=-c.img.width-10;
      ctx.drawImage(c.img,Math.round(c.x),Math.round(c.y));
    }
    ctx.drawImage(land,0,0);

      // moonlight shimmer on the lake

      // fireflies
      if(flies.length<Math.round(W/28)){ flies.push({x:Math.random()*W,y:lakeBot+Math.random()*(H-lakeBot-4),vx:0,vy:0,ph:Math.random()*6.28}); }
      for(const f of flies){ f.ph+=.12; f.vx+=(Math.random()-.5)*.08; f.vy+=(Math.random()-.5)*.06; f.vx*=.92; f.vy*=.92; f.x+=f.vx; f.y+=f.vy;
        if(f.y<lakeBot-14) f.vy+=.05; if(f.y>H-3) f.vy-=.05; if(f.x<0) f.x=W; if(f.x>W) f.x=0;

        ctx.globalAlpha=a*.35; ctx.fillStyle="#e6ff8a"; ctx.fillRect((f.x|0)-1,(f.y|0)-1,3,3);
        ctx.globalAlpha=a; ctx.fillStyle="#f6ffc0"; ctx.fillRect(f.x|0,f.y|0,1,1); }
      ctx.globalAlpha=1;
    }
    if(!reduce&&!NIGHT){
      // water sparkle
      ctx.fillStyle="rgba(255,248,236,.7)";
      for(let i=0;i<Math.round(W/80);i++){
        const y=lakeTop+2+((i*37+frame)%(lakeBot-lakeTop-3)); const x=(i*97+frame*0.7)%W;
        if(((frame>>3)+i)%3===0) ctx.fillRect(x|0,y,3+(i%3),1);
      }
      // leaves and petals
      if(leaves.length<Math.round(W/45)&&Math.random()<.07){
        const fromTree=Math.random()<.6;
        leaves.push({x:fromTree?treeBox.x0+Math.random()*treeBox.x1:Math.random()*W*.4,y:fromTree?treeBox.y0+Math.random()*(treeBox.y1-treeBox.y0):-4,
          vx:.18+Math.random()*.3,vy:.12+Math.random()*.18,ph:Math.random()*6,
          c:[hex("#e8a55a"),hex("#d97d5b"),hex("#f3c97a"),hex("#c9a2a6")][Math.random()*4|0]});
      }
      for(const l of leaves){
        l.ph+=.08; l.x+=l.vx+Math.sin(l.ph)*.25; l.y+=l.vy+Math.cos(l.ph*.7)*.08;
        ctx.fillStyle=css(l.c); ctx.fillRect(l.x|0,l.y|0,2,1); if(Math.sin(l.ph)>0) ctx.fillRect((l.x|0)+1,(l.y|0)+1,1,1);
      }
      leaves=leaves.filter(l=>l.x<W+4&&l.y<H+4);
      // birds
      if(birds.length<2&&Math.random()<.004) birds.push({x:-6,y:20+Math.random()*horizon*.4,v:.35+Math.random()*.25,f:0});
      ctx.fillStyle="#7a5a5e";
      for(const b of birds){
        b.x+=b.v; b.f++; const up=(b.f>>3)&1, x=b.x|0, y=b.y|0;
        ctx.fillRect(x,y,1,1); ctx.fillRect(x-1,y-(up?1:0),1,1); ctx.fillRect(x+1,y-(up?1:0),1,1);
        ctx.fillRect(x-2,y-(up?2:-1),1,1); ctx.fillRect(x+2,y-(up?2:-1),1,1);
      }
      birds=birds.filter(b=>b.x<W+6);
    }
    last=ts;
  }

  let acc=0, prev=0, raf;
  function loop(ts){
    raf=requestAnimationFrame(loop);
    if(document.hidden) return;
    acc+=ts-prev; prev=ts;
    if(acc<66) return; acc=0;   // ~15 fps for a pixel-art feel
    draw(ts);
  }
  window.setSceneNight=b=>{ NIGHT=!!b; build(); draw(0); };
  NIGHT=document.body.classList.contains("night");
  build(); draw(0);
  if(!reduce) raf=requestAnimationFrame(loop);
  let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{build();draw(0)},150)});
})();
</script>
</body>
